version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nigerian_directory_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-nigerian_directory}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nigerian_directory_network

  redis:
    image: redis:7-alpine
    container_name: nigerian_directory_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - nigerian_directory_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nigerian_directory_backend
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-nigerian_directory}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-devpassword123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - nigerian_directory_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nigerian_directory_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - nigerian_directory_network
    command: npm run dev

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: nigerian_directory_crawler
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-nigerian_directory}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-devpassword123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./crawler:/app
    depends_on:
      - postgres
      - redis
    networks:
      - nigerian_directory_network

volumes:
  postgres_data:
  redis_data:

networks:
  nigerian_directory_network:
    driver: bridge
