name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Backend tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testpassword123' }}
          POSTGRES_DB: nigerian_directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nigerian_directory_test
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testpassword123' }}
        run: |
          npm run migrate || echo "Migration script not configured"

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nigerian_directory_test
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testpassword123' }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET || 'test-jwt-secret-for-ci-minimum-32-chars' }}
        run: npm test

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint || true

  # Frontend tests
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # Crawler tests
  crawler-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install crawler dependencies
        working-directory: ./crawler
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run crawler tests
        working-directory: ./crawler
        run: pytest --cov=. --cov-report=xml || true

  # Docker build test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, crawler-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t nigerian-directory-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t nigerian-directory-frontend ./frontend

      - name: Build crawler Docker image
        run: docker build -t nigerian-directory-crawler ./crawler

  # Deploy to staging (develop branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: echo "Deploy to staging environment"
        # Add your staging deployment commands here
        # e.g., deploy to Vercel preview, Railway staging, etc.

  # Deploy to production (main branch)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: echo "Deploy to production environment"
        # Add your production deployment commands here
        # e.g., deploy to Vercel, Railway, DigitalOcean, etc.
