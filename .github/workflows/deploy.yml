name: Production smoke test

# Deployment itself is done by Vercel's GitHub integration: every push to
# main redeploys the website (www.nigeriandirectory.com.ng) and the API
# (nigeriandirectory-api.vercel.app). This workflow only checks that the
# live site answers after a push, retrying while Vercel finishes the build.
# (The previous version targeted Railway/Docker and an old domain, and used
# `secrets` in `if:` conditions, which GitHub rejects, so every run failed
# before any job started.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: production-smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check live endpoints
        run: |
          set -u
          check() {
            local url="$1" expect="$2"
            for i in $(seq 1 20); do
              body=$(curl -fsSL --max-time 30 "$url") && echo "$body" | grep -qi "$expect" && {
                echo "OK  $url"; return 0; }
              echo "... $url not ready (attempt $i/20), retrying in 15s"
              sleep 15
            done
            echo "FAIL $url"; return 1
          }
          status=0
          check "https://nigeriandirectory-api.vercel.app/health" "ok\|healthy\|status" || status=1
          check "https://nigeriandirectory-api.vercel.app/api/news/months?limit=1" "months" || status=1
          check "https://www.nigeriandirectory.com.ng/" "Nigerian Directory" || status=1
          check "https://www.nigeriandirectory.com.ng/news/" "News" || status=1
          check "https://www.nigeriandirectory.com.ng/sitemap.xml" "<urlset" || status=1
          exit $status
