name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'crawler/**'
      - '.github/workflows/deploy.yml'
      - '.env.example'

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Pre-deployment checks
  pre-deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are configured
        run: |
          echo "Checking production secrets..."
          [ -n "${{ secrets.DB_HOST }}" ] && echo "✓ DB_HOST" || (echo "✗ DB_HOST missing" && exit 1)
          [ -n "${{ secrets.DB_PASSWORD }}" ] && echo "✓ DB_PASSWORD" || (echo "✗ DB_PASSWORD missing" && exit 1)
          [ -n "${{ secrets.JWT_SECRET }}" ] && echo "✓ JWT_SECRET" || (echo "✗ JWT_SECRET missing" && exit 1)
          [ -n "${{ secrets.NEXT_PUBLIC_API_URL }}" ] && echo "✓ NEXT_PUBLIC_API_URL" || (echo "✗ NEXT_PUBLIC_API_URL missing" && exit 1)
          [ -n "${{ secrets.FRONTEND_URL }}" ] && echo "✓ FRONTEND_URL" || (echo "✗ FRONTEND_URL missing" && exit 1)
          echo "All critical secrets configured ✓"

  # Build Docker images
  build-images:
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    strategy:
      matrix:
        service: [backend, frontend, crawler]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

  # Database migrations
  database-migration:
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          npm run migrate || echo "Migration script not configured, skipping"
          echo "Database migration completed"

  # Deploy backend
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-images, database-migration]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Railway deployment instructions:"
          echo "1. Install Railway CLI: npm install -g @railway/cli"
          echo "2. Connect: railway link <project-id>"
          echo "3. Deploy: railway up --service backend"
          echo ""
          echo "Or use Railway GitHub integration for auto-deploy"
          echo "Configure in: https://railway.app/project/[project-id]/settings"

      - name: Deploy backend to DigitalOcean (if configured)
        if: ${{ secrets.DIGITALOCEAN_TOKEN }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          echo "DigitalOcean deployment via GitHub integration"
          echo "Ensure .do/app.yaml is in repository root"

      - name: Deploy backend to Render (if configured)
        if: ${{ secrets.RENDER_API_KEY }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Render deployment via GitHub integration"
          echo "Connected at: https://dashboard.render.com/"

  # Deploy frontend
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

      - name: Deploy to Railway (if configured)
        if: ${{ secrets.RAILWAY_TOKEN }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Railway deployment instructions for frontend:"
          echo "Configure Railway GitHub integration at:"
          echo "https://railway.app/project/[project-id]/settings"

  # Smoke tests
  smoke-tests:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Test backend health
        run: |
          HEALTH_URL="https://api.nigeriandirectory.com/health"
          echo "Testing backend health endpoint: $HEALTH_URL"
          for i in {1..5}; do
            if curl -f $HEALTH_URL; then
              echo "✓ Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/5 - retrying in 10s..."
            sleep 10
          done
          echo "✗ Backend health check failed"
          exit 1

      - name: Test frontend availability
        run: |
          FRONTEND_URL="https://nigeriandirectory.com"
          echo "Testing frontend: $FRONTEND_URL"
          for i in {1..5}; do
            if curl -f $FRONTEND_URL | grep -q "nigerian"; then
              echo "✓ Frontend is available"
              exit 0
            fi
            echo "Attempt $i/5 - retrying in 10s..."
            sleep 10
          done
          echo "✗ Frontend health check failed"
          exit 1

      - name: Test API endpoints
        run: |
          echo "Testing API endpoints..."
          curl -f https://api.nigeriandirectory.com/api || exit 1
          curl -f https://api.nigeriandirectory.com/api/schools || exit 1
          curl -f https://api.nigeriandirectory.com/api/locations || exit 1
          echo "✓ All endpoints responding"

  # Notify deployment status
  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, smoke-tests]
    if: always()
    steps:
      - name: Determine deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ] && \
             [ "${{ needs.deploy-frontend.result }}" == "success" ] && \
             [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "DEPLOYMENT_STATUS=✓ SUCCESSFUL" >> $GITHUB_ENV
          else
            echo "DEPLOYMENT_STATUS=✗ FAILED" >> $GITHUB_ENV
          fi

      - name: Log deployment result
        run: |
          echo "═════════════════════════════════════════"
          echo "Deployment Status: ${{ env.DEPLOYMENT_STATUS }}"
          echo "═════════════════════════════════════════"
          echo ""
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          echo "Smoke Tests: ${{ needs.smoke-tests.result }}"
          echo ""
          echo "Frontend: https://nigeriandirectory.com"
          echo "API: https://api.nigeriandirectory.com"
          echo "Health: https://api.nigeriandirectory.com/health"

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "NigerianDirectory Deployment ${{ env.DEPLOYMENT_STATUS }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*\n${{ env.DEPLOYMENT_STATUS }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Backend*\n${{ needs.deploy-backend.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Frontend*\n${{ needs.deploy-frontend.result }}"
                    }
                  ]
                }
              ]
            }

