# ============================================
# Docker Compose - Test Environment
# ============================================
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   npm test
#   docker-compose -f docker-compose.test.yml down

version: '3.8'

services:
  # PostgreSQL Database - Test Instance
  postgres-test:
    image: postgres:15-alpine
    container_name: nigerian_directory_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nigerian_directory_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nigerian_directory_test_network

  # Redis Cache - Test Instance
  redis-test:
    image: redis:7-alpine
    container_name: nigerian_directory_test_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nigerian_directory_test_network

networks:
  nigerian_directory_test_network:
    driver: bridge
