version: '3.8'

# Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  nginx:
    image: nginx:alpine
    container_name: nigerian_directory_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nigerian_directory_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: nigerian_directory_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nigerian_directory_network
    restart: unless-stopped
    # No ports exposed externally in production

  redis:
    image: redis:7-alpine
    container_name: nigerian_directory_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nigerian_directory_network
    restart: unless-stopped
    # No ports exposed externally in production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nigerian_directory_backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      # nginx is the one proxy in front of the API; read the client IP from it
      - TRUST_PROXY=1
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - nigerian_directory_network
    restart: unless-stopped
    command: node server.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nigerian_directory_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NEXT_PUBLIC_SITE_URL=https://${DOMAIN}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      - backend
    networks:
      - nigerian_directory_network
    restart: unless-stopped
    command: npm run start

volumes:
  postgres_data:
  redis_data:

networks:
  nigerian_directory_network:
    driver: bridge
